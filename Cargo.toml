[package]
name = "tlq"
version = "0.4.0"
edition = "2021"
authors = ["Nebojsa Jakovljevic nebojsa@nebjak.dev"]
license = "MIT"
description = "Tiny Little Queue"

[[bin]]
name = "tlq"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/mod.rs"

[dependencies]
uuid = { version = "1.29", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
async-trait = "0.1.92"
tokio = { version = "1.54", features = ["full"] }
axum = "0.8.9"
skyak_axum_core = "0.3.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
http = "1.5.0"
mime = "0.3.17"
tower = "0.5.3"
http-body-util = "0.1.5"
regex = "1.13.1"
